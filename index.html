<script>
(function(){try{
  var KEY='ns_visits';var TRACK='/track.php';
  var vid=localStorage.getItem('ns_vid');
  if(!vid){vid=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('ns_vid',vid);}
  var p=new URLSearchParams(location.search);
  var ref=document.referrer;
  var rh='';try{rh=ref?new URL(ref).hostname.replace(/^www\./,''):''}catch(e){}
  var ua=navigator.userAgent||'';
  // Canonicalize aliases so ad links tagged utm_source=fb/ig/adwords etc.
  // land in the same bucket as auto-detected Facebook/Google/etc, instead
  // of fragmenting traffic sources (and lead sources) into near-duplicates.
  var CANON={fb:'Facebook',facebook:'Facebook',ig:'Instagram',instagram:'Instagram',
    google:'Google','google ads':'Google Ads',googleads:'Google Ads',adwords:'Google Ads',
    gads:'Google Ads',bing:'Bing',tiktok:'TikTok',direct:'Direct'};
  var canon=function(s){var k=(s||'').toLowerCase().trim();return CANON[k]||s;};
  var src=canon(p.get('utm_source'))||(function(){
    if(p.has('fbclid'))return'Facebook';
    if(p.has('gclid'))return'Google Ads';
    // In-app browsers (opened from a Facebook/Instagram post, DM, or story)
    // frequently withhold document.referrer, so a UA sniff catches these
    // before they fall through to Direct.
    if(/FBAN|FBAV|FB_IAB/.test(ua))return'Facebook';
    if(/Instagram/.test(ua))return'Instagram';
    if(!ref)return'Direct';
    if(/facebook\.com|instagram\.com|fb\.com/.test(rh))return'Facebook';
    if(/google\.com/.test(rh))return'Google';
    if(/bing\.com/.test(rh))return'Bing';
    if(/tiktok\.com/.test(rh))return'TikTok';
    return rh||'Direct';
  })();
  // Dark-social shares (texted links, DMs) and repeat visits that come back
  // by typed URL/bookmark have no referrer or UTM at all and would otherwise
  // get mislabeled Direct even though this visitor was originally attributed
  // to a real source. Remember the last known non-Direct source per browser
  // and reapply it whenever a later visit resolves to Direct.
  try{
    if(src!=='Direct'){localStorage.setItem('ns_last_src',src);}
    else{var lastSrc=localStorage.getItem('ns_last_src');if(lastSrc)src=lastSrc;}
  }catch(e){}
  var medium=p.get('utm_medium')||'', campaign=p.get('utm_campaign')||'';
  // Exposed so the booking form can tag a submission with the same attribution
  // this visit was tracked under, instead of every lead saying "Website form".
  window.nsAttribution={source:src,medium:medium,campaign:campaign};
  var visit={
    id:Math.random().toString(36).slice(2)+Date.now().toString(36),
    vid:vid,
    ts:Date.now(),url:location.href,ref:ref,
    source:src,medium:medium,
    campaign:campaign,
    content:p.get('utm_content')||'',
    term:p.get('utm_term')||'',duration:0
  };
  var list=[];try{list=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
  if(!Array.isArray(list))list=[];
  list.push(visit);if(list.length>5000)list=list.slice(-5000);
  localStorage.setItem(KEY,JSON.stringify(list));
  try{fetch(TRACK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(visit),keepalive:true});}catch(e){}
  var t0=Date.now();
  function saveLocal(){
    var dur=Math.round((Date.now()-t0)/1000);
    try{var s=JSON.parse(localStorage.getItem(KEY)||'[]');
      var i=s.findIndex(function(v){return v.id===visit.id});
      if(i!==-1){s[i].duration=dur;localStorage.setItem(KEY,JSON.stringify(s));}
    }catch(e){}
    return dur;
  }
  function saveServer(dur){
    var pl=JSON.stringify({action:'duration',id:visit.id,duration:dur});
    try{if(navigator.sendBeacon)navigator.sendBeacon(TRACK,new Blob([pl],{type:'application/json'}));
      else fetch(TRACK,{method:'POST',headers:{'Content-Type':'application/json'},body:pl,keepalive:true});
    }catch(e){}
  }
  function save(){var dur=saveLocal();saveServer(dur);}
  // Public hook for anonymous interaction events (e.g. gallery click/scroll).
  window.nsTrackEvent=function(kind,meta){
    try{
      var pl=JSON.stringify({action:'event',kind:kind,meta:meta||'',vid:vid,ts:Date.now()});
      if(navigator.sendBeacon)navigator.sendBeacon(TRACK,new Blob([pl],{type:'application/json'}));
      else fetch(TRACK,{method:'POST',headers:{'Content-Type':'application/json'},body:pl,keepalive:true});
    }catch(e){}
  };
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')save();});
  window.addEventListener('beforeunload',save);
  window.addEventListener('pagehide',save);
}catch(e){}})();
</script>
